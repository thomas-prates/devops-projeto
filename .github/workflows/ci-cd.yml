name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Executar cobertura
        run: npm run test:coverage

      - name: Gerar build
        run: npm run build

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init -backend=false

      - name: Verificar formatação
        run: terraform fmt -check

      - name: Validar Terraform
        run: terraform validate

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ci, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thomas-prates/devops-projeto
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy no servidor
        env:
          IMAGE: ghcr.io/thomas-prates/devops-projeto:latest
          PORT: 3000
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "Secrets de deploy não configurados. Pulando deploy."
            echo "Configure SSH_PRIVATE_KEY, SERVER_IP e SERVER_USER nos secrets do GitHub."
            exit 0
          fi
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no scripts/deploy.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "chmod +x /tmp/deploy.sh && IMAGE=$IMAGE PORT=$PORT /tmp/deploy.sh"

      - name: Health Check
        if: success()
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "Secrets de deploy não configurados. Pulando health check."
            exit 0
          fi
          sleep 10
          curl --fail --silent --show-error "http://${{ secrets.SERVER_IP }}:3000/health"

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Testar API
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "Secrets de deploy não configurados. Pulando smoke tests."
            exit 0
          fi
          # Testar health endpoint
          curl --fail --silent --show-error "http://${{ secrets.SERVER_IP }}:3000/health"

          # Testar criação de tarefa
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d '{"title":"Test Task","description":"Smoke test task","status":"pending"}' \
            "http://${{ secrets.SERVER_IP }}:3000/tasks"

          # Testar listagem de tarefas
          curl --fail --silent --show-error "http://${{ secrets.SERVER_IP }}:3000/tasks"
